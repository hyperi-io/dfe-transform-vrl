name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Tag to publish (e.g. v1.0.3)"
      from-head:
        type: string
        required: false
        default: ""
        description: "'true' to release/retry the current HEAD."
      bump:
        type: string
        required: false
        default: "auto"
        description: "from-head version: auto | patch | minor | X.Y.Z (exact)."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      # `both` resolves to release channel and unlocks Tier 2 (PGO+BOLT).
      # `internal` would resolve to spike channel = Tier 1 only — silent
      # demotion that loader v1.17.4 hit before flipping to `both` in v1.17.5.
      publish-target: both
      tag: ${{ inputs.tag || '' }}
      from-head: ${{ inputs.from-head || '' }}
      bump: ${{ inputs.bump || 'auto' }}
    secrets: inherit
