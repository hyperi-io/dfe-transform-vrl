# Project:   dfe-transform-vrl
# File:      deny.toml
# Purpose:   cargo-deny configuration for dependency checking
# Language:  TOML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "all"
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Each entry MUST have a comment with: (1) why the advisory is tolerated,
# (2) the upstream-blocker preventing remediation, (3) when to revisit.
# Empty list = nothing tolerated; CI fails on any new advisory.
ignore = []

[licenses]
allow = [
    "BUSL-1.1",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MIT-0",
    "0BSD",
]
confidence-threshold = 0.8
exceptions = []
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
deny = []
allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
# Temporary: scalo's held-ack branch until 2.13.0 publishes; goes with the
# [patch.crates-io] entry in Cargo.toml.
allow-git = ["https://github.com/hyperi-io/scalo-rs"]

[sources.allow-org]
