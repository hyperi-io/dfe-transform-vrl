[package]
name = "dfe-transform-vrl"
version = "1.0.2"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Embedded VRL transform engine — Kafka-to-Kafka with wrapper-controlled source/sink"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-transform-vrl"
rust-version = "1.94"
exclude = [***REMOVED*** ".github/", ***REMOVED*** "chart/", "docs/", ".tmp/"]

[lib]
name = "dfe_transform_vrl"
path = "src/lib.rs"

[[bin]]
name = "dfe-transform-vrl"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = ">=1.50", features = ["full"] }
tokio-util = { version = ">=0.7.18", features = ["rt"] }

# Shared library — use for everything it provides. NO bespoke code that
***REMOVED***hyperi-rustlib = { version = ">=2.4.3", features = [
    "cli",
    "config",
    "config-reload",
    "deployment",
    "http-server",
    "logger",
    "memory",
    "metrics",
    "metrics-dfe",
    "scaling",
    "transport",
    "transport-kafka",
    "transport-grpc",
    "http",
    "worker",
] }

# VRL — Vector Remap Language (embedded transform engine)
vrl = ">=0.31"

# CLI (project-specific subcommands, not duplicating rustlib CLI framework)
clap = { version = ">=4.5.60", features = ["derive", "env"] }

# Configuration (project-specific schema, not duplicating rustlib config cascade)
figment = { version = ">=0.10.19", features = ["env"] }
dotenvy = ">=0.15.7"
serde_yaml_ng = ">=0.10.0"

# Metrics types (Counter, Gauge, Histogram) returned by rustlib MetricsManager
metrics = ">=0.24.3, <0.25"

# Serialisation
serde = { version = ">=1.0.228", features = ["derive"] }
serde_json = ">=1.0.149"
sonic-rs = ">=0.5"
rmp-serde = ">=1.3.1"

# Error handling
thiserror = ">=2.0.18"
anyhow = ">=1.0.98"

# Logging and tracing
tracing = ">=0.1.44"

# Enrichment engine — high-performance lookups
rustc-hash = ">=2"
arc-swap = ">=1.7"
csv = ">=1.3"

# Optional enrichment sources
maxminddb = { version = ">=0.24", optional = true }
rusqlite = { version = ">=0.32", features = ["bundled"], optional = true }

[features]
default = []
transport-memory = ["hyperi-rustlib/transport-memory"]
enrichment-mmdb = ["dep:maxminddb"]
enrichment-sqlite = ["dep:rusqlite"]

[dev-dependencies]
tempfile = ">=3.20"
tokio-test = ">=0.4.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false
