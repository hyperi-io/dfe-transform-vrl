[package]
name = "dfe-transform-vrl"
version = "1.1.5"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Embedded VRL transform engine — Kafka-to-Kafka with wrapper-controlled source/sink"
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-transform-vrl"
rust-version = "1.95"
exclude = [".github/", "chart/", "docs/", ".tmp/"]

[lib]
name = "dfe_transform_vrl"
path = "src/lib.rs"

[[bin]]
name = "dfe-transform-vrl"
path = "src/main.rs"

# PGO workload driver — only built with `--features pgo-driver`.
# Used by scripts/pgo-workload.sh during release-channel Tier 2 builds
# (PGO instrumentation phase). Default `cargo build` skips it entirely.
[[bin]]
name = "pgo-driver"
path = "src/bin/pgo-driver.rs"
required-features = ["pgo-driver"]

[dependencies]
# Async runtime. `full` is acceptable; we use macros, rt-multi-thread,
# signal, sync, time, task, test (test is dev-only but `full` covers it).
tokio = { version = ">=1.50, <2", features = ["full"] }

# CancellationToken (scalo's shutdown token type) -- used to drive the
# governed engine driver to a clean stop.
tokio-util = ">=0.7, <0.8"

# Zero-copy payload bytes -- the WorkBatch/Record currency. Cheap clone
# (refcount bump), passed by value into the transport sender.
bytes = ">=1.7, <2"

# Shared library — use for everything it provides. NO bespoke code that
# duplicates scalo functionality ("scalo first" policy).
#
# Feature list audited 2026-04-29: only includes features whose API surface
# is referenced in src/ or tests/. NOT included (verified zero refs):
#   - `http` — would pull reqwest + reqwest-middleware + reqwest-retry 0.7
#     (the transitive wasm-timer / instant 0.1.13 chain). The wrapper does
#     no outbound HTTP; scalo's HttpClient was speculatively enabled and
#     never wired up.
#   - `transport-grpc` — would pull tonic + prost + tonic-prost-build +
#     prost-build. The wrapper does Kafka in/out only.
# When wiring HTTP/gRPC sinks (e.g. for enrichment refresh), re-enable the
# specific feature at that point — don't pre-enable speculatively.
#
# `scaling` drives the unified `ScalingPressure` engine the runtime serves at
# `/scaling/pressure` to KEDA. The 2.9 governor (`governor` feature, default-ON)
# owns the inbound pause-partitions brake + AIMD byte budget over the shared
# memory guard; scaling holds the weighted KEDA composite. Both are config-keyed
# (`scaling` / `self_regulation`), no CEL expression engine needed.
scalo = { version = ">=2.10.4, <3", features = [
    "cli-service",
    "config",
    "config-reload",
    "config-schema",
    "deployment",
    "governor",
    "http-server",
    "logger",
    "memory",
    "metrics",
    "scaling",
    "service-metrics",
    "transport",
    "transport-kafka",
    "worker-batch",
    "worker-pool",
] }

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.1, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# VRL — Vector Remap Language (embedded transform engine)
vrl = ">=0.33.1, <0.34"

# CLI (project-specific subcommands, not duplicating scalo CLI framework).
# `derive` for #[derive(Parser)]; `env` not needed — we have no env-backed
# args (scalo config cascade handles env-var binding for us).
clap = { version = ">=4.5.60, <5", features = ["derive"] }

# Configuration (project-specific schema, not duplicating scalo config cascade)
figment = { version = ">=0.10.19, <0.11", features = ["env"] }
dotenvy = ">=0.15.7, <0.16"
serde_yaml_ng = ">=0.10.0, <0.11"

# Metrics types (Counter, Gauge, Histogram) returned by scalo MetricsManager
metrics = ">=0.24.3, <0.25"

# Serialisation
serde = { version = ">=1.0.228, <2", features = ["derive"] }
serde_json = ">=1.0.149, <2"
sonic-rs = ">=0.5, <0.6"
rmp-serde = ">=1.3.1, <2"

# Error handling
thiserror = ">=2.0.18, <3"
anyhow = ">=1.0.98, <2"

# Logging and tracing
tracing = ">=0.1.44, <0.2"

# Enrichment engine — high-performance lookups
rustc-hash = ">=2, <3"
arc-swap = ">=1.7, <2"
csv = ">=1.3, <2"

# Optional enrichment sources
maxminddb = { version = ">=0.28.1, <0.29", optional = true }
rusqlite = { version = ">=0.40.1, <0.41", features = ["bundled"], optional = true }

# Optional allocator (jemalloc-only per 2026-04-17 DFE policy).
# hyperi-ci enables `--features jemalloc` automatically at every channel
# (spike/alpha/beta/release). Default build keeps system allocator so
# local dev `cargo build` stays fast.
tikv-jemallocator = { version = ">=0.7.0, <0.8", optional = true }

# Direct rdkafka — ONLY used by the pgo-driver bin under `--features pgo-driver`.
# Default builds (and `--features jemalloc`) skip this entirely. The main
# wrapper uses Kafka via scalo transport-kafka, never directly.
rdkafka = { version = ">=0.39, <0.40", features = ["tokio", "cmake-build"], optional = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
# pgo-driver: build the workload-driver bin used by scripts/pgo-workload.sh
# during PGO instrumentation. NOT enabled in production builds.
pgo-driver = ["dep:rdkafka"]
transport-memory = ["scalo/transport-memory"]
enrichment-mmdb = ["dep:maxminddb"]
enrichment-sqlite = ["dep:rusqlite"]

[dev-dependencies]
tempfile = ">=3.20, <4"
# Testcontainers — auto-spawn Apache Kafka for e2e tests when no live broker
# is available (live broker via $KAFKA_BROKERS / TEST_MODE=docker takes precedence).
# Container is cleaned up via RAII Drop when the test ends.
testcontainers = ">=0.27, <0.28"
testcontainers-modules = { version = ">=0.15, <0.16", features = ["kafka"] }

[lints.rust]
unsafe_code = "forbid"
# Documentation enforcement. Currently `allow` — there are ~90 undocumented-
# but-public items (mostly struct fields in config/loader.rs and metrics.rs).
# Once those land, promote to `warn`, then `deny`. Cannot run as `warn` while
# hyperi-ci CI uses `-D warnings` (warn-level lints become hard errors and
# block the push).
missing_docs = "allow"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
bare_urls = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

