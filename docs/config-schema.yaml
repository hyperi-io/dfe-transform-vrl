$schema: https://json-schema.org/draft/2020-12/schema
title: Config
description: |-
  Main configuration.

  ## Hot-reload classification

  **Hot-reloaded** (takes effect on next batch, via `SharedConfig<HotConfig>`):
  - `pipeline.batch_size`
  - `pipeline.batch_timeout_ms`
  - `sink.key_field`
  - `scaling.pressure_threshold`

  **Requires pod restart** (bound at startup):
  - `pipeline.name` — baked into Kafka `group_id`, metrics labels, tracing spans
  - `source.*` — rdkafka consumer: connection, subscription, auth, TLS, buffers
  - `sink.brokers` — rdkafka producer connection established at startup
  - `sink.topic` — output topic (changing mid-stream risks data loss)
  - `sink.compression` — rdkafka `compression.type` set at producer creation
  - `sink.sasl.*` / `sink.tls.*` — security protocol set at producer creation
  - `sink.max_buffer_bytes` — rdkafka `queue.buffering.max.kbytes` at creation
  - `sink.librdkafka_options` — passed to `ClientConfig` at creation
  - `transforms.*` — VRL programs compiled at startup, immutable for process lifetime
  - `health.address` — HTTP server binds to socket at startup
  - `metrics.address` — metrics server binds to socket at startup
  - `logging.*` — tracing subscriber configured at startup
type: object
properties:
  pipeline:
    $ref: '#/$defs/PipelineConfig'
    default:
      name: default
      batch_size: 1000
      batch_timeout_ms: 100
  source:
    $ref: '#/$defs/SourceConfig'
    default:
      brokers:
      - localhost:9092
      topics:
      - events
      group_id: dfe-transform-vrl
      format: auto
      max_buffer_bytes: 67108864
      sasl:
        enabled: false
        mechanism: scram_sha_512
        username: ''
        password: ''
      tls:
        enabled: false
        ca_cert_file: null
        cert_file: null
        key_file: null
        skip_verify: false
      auto_offset_reset: latest
      session_timeout_ms: 30000
      commit_interval_ms: 5000
      statistics_interval_ms: 5000
      librdkafka_options: {}
  sink:
    $ref: '#/$defs/SinkConfig'
    default:
      brokers:
      - localhost:9092
      topic: ''
      key_field: ''
      compression: zstd
      max_buffer_bytes: 67108864
      sasl:
        enabled: false
        mechanism: scram_sha_512
        username: ''
        password: ''
      tls:
        enabled: false
        ca_cert_file: null
        cert_file: null
        key_file: null
        skip_verify: false
      message_timeout_ms: 300000
      librdkafka_options: {}
  transforms:
    $ref: '#/$defs/TransformConfig'
    default:
      dir: null
      files: null
  enrichment_tables:
    type: array
    items:
      $ref: '#/$defs/EnrichmentTableConfig'
    default: []
  health:
    $ref: '#/$defs/HealthConfig'
    default:
      address: 0.0.0.0:9000
  metrics:
    $ref: '#/$defs/MetricsConfig'
    default:
      address: 0.0.0.0:9090
  logging:
    $ref: '#/$defs/LoggingConfig'
    default:
      level: info
      format: json
  scaling:
    $ref: '#/$defs/ScalingConfig'
    default:
      pressure_threshold: 0.8
$defs:
  PipelineConfig:
    description: Pipeline identity and processing settings.
    type: object
    properties:
      name:
        description: Pipeline name (used in metrics labels, Kafka `group_id`, logging).
        type: string
        default: default
      batch_size:
        description: Events per transform batch.
        type: integer
        format: uint
        minimum: 0
        default: 1000
      batch_timeout_ms:
        description: Max wait (ms) for a full batch before processing a partial batch.
        type: integer
        format: uint64
        minimum: 0
        default: 100
  SourceConfig:
    description: Kafka source configuration (wrapper-controlled consumer).
    type: object
    properties:
      brokers:
        type: array
        items:
          type: string
        default:
        - localhost:9092
      topics:
        type: array
        items:
          type: string
        default:
        - events
      group_id:
        type: string
        default: dfe-transform-vrl
      format:
        description: 'Payload format: auto, json, msgpack.'
        type: string
        default: auto
      max_buffer_bytes:
        description: Maximum consumer buffer size in bytes.
        type: integer
        format: uint64
        minimum: 0
        default: 67108864
      sasl:
        $ref: '#/$defs/SaslConfig'
        default:
          enabled: false
          mechanism: scram_sha_512
          username: ''
          password: ''
      tls:
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          ca_cert_file: null
          cert_file: null
          key_file: null
          skip_verify: false
      auto_offset_reset:
        type: string
        default: latest
      session_timeout_ms:
        type: integer
        format: uint32
        minimum: 0
        default: 30000
      commit_interval_ms:
        type: integer
        format: uint32
        minimum: 0
        default: 5000
      statistics_interval_ms:
        description: |-
          librdkafka statistics emission interval (ms). 0 = disabled.
          When enabled (and scalo supports `StatsContext` in `KafkaTransport`),
          rdkafka broker RTT, consumer lag, and queue depth metrics auto-emit
          to the Prometheus `/metrics` endpoint.
        type: integer
        format: uint32
        minimum: 0
        default: 5000
      librdkafka_options:
        description: Extra librdkafka options.
        type: object
        additionalProperties:
          type: string
        default: {}
  SaslConfig:
    description: SASL authentication for Kafka.
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      mechanism:
        description: 'SASL mechanism: plain, `scram_sha_256`, `scram_sha_512`.'
        type: string
        default: scram_sha_512
      username:
        type: string
        default: ''
      password:
        type: string
        default: ''
  TlsConfig:
    description: TLS configuration for Kafka.
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      ca_cert_file:
        type:
        - string
        - 'null'
        default: null
      cert_file:
        type:
        - string
        - 'null'
        default: null
      key_file:
        type:
        - string
        - 'null'
        default: null
      skip_verify:
        type: boolean
        default: false
  SinkConfig:
    description: Kafka sink configuration (wrapper-controlled producer).
    type: object
    properties:
      brokers:
        type: array
        items:
          type: string
        default:
        - localhost:9092
      topic:
        type: string
        default: ''
      key_field:
        description: Event field path for Kafka partition key (e.g., ".`org_id`").
        type: string
        default: ''
      compression:
        description: 'Compression: none, gzip, lz4, snappy, zstd.'
        type: string
        default: zstd
      max_buffer_bytes:
        description: Maximum producer buffer size in bytes.
        type: integer
        format: uint64
        minimum: 0
        default: 67108864
      sasl:
        $ref: '#/$defs/SaslConfig'
        default:
          enabled: false
          mechanism: scram_sha_512
          username: ''
          password: ''
      tls:
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          ca_cert_file: null
          cert_file: null
          key_file: null
          skip_verify: false
      message_timeout_ms:
        description: Producer delivery timeout (ms).
        type: integer
        format: uint32
        minimum: 0
        default: 300000
      librdkafka_options:
        description: Extra librdkafka options.
        type: object
        additionalProperties:
          type: string
        default: {}
  TransformConfig:
    description: VRL transform file configuration.
    type: object
    properties:
      dir:
        description: Directory to load all .vrl transform files from (sorted by filename).
        type:
        - string
        - 'null'
        default: null
      files:
        description: Explicit list of .vrl file paths (loaded in order).
        type:
        - array
        - 'null'
        items:
          type: string
        default: null
  EnrichmentTableConfig:
    description: |-
      Enrichment table configuration.

      Supports two config formats:
      - **New (tagged):** `source` field with type-tagged enum (`file`, `mmdb`, `stix`, `sqlite`)
      - **Legacy (flat):** `path` + `key_columns` only (treated as `File` with auto format detection)
    type: object
    properties:
      name:
        description: 'Table name used in VRL: `get_enrichment_table_record("name", ...)`.'
        type: string
        default: ''
      path:
        description: Path to enrichment data file (legacy flat format — kept for backwards compat).
        type: string
        default: ''
      key_columns:
        description: Lookup key column(s). Multiple columns are concatenated with `\x00`.
        type: array
        items:
          type: string
        default: []
      source:
        description: Source definition (new tagged format). Takes precedence over `path`.
        anyOf:
        - $ref: '#/$defs/EnrichmentSourceConfig'
        - type: 'null'
        default: null
      schema:
        description: |-
          Per-column type coercion, matching Vector's file enrichment table
          `schema`. Without an entry a CSV cell stays a string, so
          `status_code: integer` is what makes `{"status_code": 1}` match, and a
          `timestamp` column is what makes a `{"from": ..., "to": ...}` date
          range able to match at all. Accepted values: `string`, `int`,
          `integer`, `float`, `bool`, `boolean`, `date`, `date|<format>`,
          `timestamp`, `timestamp|<format>`.
        type: object
        additionalProperties:
          type: string
        default: {}
      refresh:
        description: Optional periodic refresh.
        anyOf:
        - $ref: '#/$defs/RefreshConfig'
        - type: 'null'
        default: null
      max_bytes:
        description: |-
          Maximum materialised table size in bytes. Fail-fast at load if exceeded.
          When set, the loaded table's memory is also registered with `MemoryGuard`
          so enrichment memory counts against the pod memory budget.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
        default: null
  EnrichmentSourceConfig:
    description: Source definition for an enrichment table.
    oneOf:
    - type: object
      properties:
        path:
          type: string
        format:
          anyOf:
          - $ref: '#/$defs/FileFormat'
          - type: 'null'
          default: null
        type:
          type: string
          const: file
      required:
      - type
      - path
    - type: object
      properties:
        path:
          type: string
        type:
          type: string
          const: mmdb
      required:
      - type
      - path
    - type: object
      properties:
        path:
          type:
          - string
          - 'null'
          default: null
        url:
          type:
          - string
          - 'null'
          default: null
        collection:
          type:
          - string
          - 'null'
          default: null
        auth:
          anyOf:
          - $ref: '#/$defs/StixAuthConfig'
          - type: 'null'
          default: null
        type:
          type: string
          const: stix
      required:
      - type
    - type: object
      properties:
        path:
          type: string
        query:
          type: string
        type:
          type: string
          const: sqlite
      required:
      - type
      - path
      - query
  FileFormat:
    description: File format for enrichment table loading.
    type: string
    enum:
    - csv
    - json
    - yaml
    - auto
  StixAuthConfig:
    description: Authentication for STIX/TAXII sources.
    type: object
    properties:
      type:
        description: 'Auth type: `bearer`, `basic`, or `api_key`.'
        type: string
      token_env:
        type:
        - string
        - 'null'
        default: null
      username_env:
        type:
        - string
        - 'null'
        default: null
      password_env:
        type:
        - string
        - 'null'
        default: null
    required:
    - type
  RefreshConfig:
    description: Periodic refresh configuration.
    type: object
    properties:
      interval_secs:
        description: 'Refresh interval in seconds. Minimum enforced: 60.'
        type: integer
        format: uint64
        minimum: 0
    required:
    - interval_secs
  HealthConfig:
    description: Health endpoint configuration.
    type: object
    properties:
      address:
        type: string
        default: 0.0.0.0:9000
  MetricsConfig:
    description: Metrics endpoint configuration.
    type: object
    properties:
      address:
        type: string
        default: 0.0.0.0:9090
  LoggingConfig:
    description: Logging configuration.
    type: object
    properties:
      level:
        type: string
        default: info
      format:
        type: string
        default: json
  ScalingConfig:
    description: KEDA scaling pressure configuration.
    type: object
    properties:
      pressure_threshold:
        type: number
        format: double
        default: 0.8
