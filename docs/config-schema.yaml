$schema: https://json-schema.org/draft/2020-12/schema
title: Config
description: |-
  Main configuration.

  ## This struct is the wrapper's half of the `--config` file

  It owns `pipeline`, `source`, `sink`, `transforms`, `enrichment_tables` and
  `dlq`.
  scalo's own sections -- `metrics`, `logger`, `memory`, `scaling`,
  `worker_pool`, `batch_processing`, `self_regulation`, `version_check`,
  `otel_tracing` --
  may sit beside them: scalo's cascade reads the same file as its settings
  layer, and its env layer outranks the file. [`SCALO_CASCADE_SECTIONS`] lists
  them, and [`warn_unreachable_scalo_settings`] warns for one in a
  working-directory `config.yaml` read without `--config`, which scalo never
  sees.

  ## Requires pod restart (bound at startup)

  - `pipeline.name` — baked into Kafka `group_id`, metrics labels, tracing spans
  - `source.*` — rdkafka consumer: connection, subscription, auth, TLS, buffers
  - `sink.brokers` — rdkafka producer connection established at startup
  - `sink.topic` — output topic (changing mid-stream risks data loss)
  - `sink.compression` — rdkafka `compression.type` set at producer creation
  - `sink.sasl.*` / `sink.tls.*` — security protocol set at producer creation
  - `sink.max_buffer_bytes` — rdkafka `queue.buffering.max.kbytes` at creation
  - `sink.librdkafka_options` — passed to `ClientConfig` at creation
  - `transforms.*` — VRL programs compiled at startup, immutable for process lifetime
  - `dlq.*` — the dead-letter queue is spawned at startup

  ## Accepted but not applied

  [`Config::inert_settings`] is the list, and the wrapper warns at startup for
  each one a deployment has actually set.
type: object
properties:
  pipeline:
    $ref: "#/$defs/PipelineConfig"
    default:
      name: default
      batch_size: 1000
      batch_timeout_ms: 100
  source:
    $ref: "#/$defs/SourceConfig"
    default:
      transport: bus
      listen: 0.0.0.0:6000
      brokers:
      - localhost:9092
      topics:
      - events
      group_id: dfe-transform-vrl
      max_buffer_bytes: 67108864
      sasl:
        enabled: false
        mechanism: scram_sha_512
        username: ""
      tls:
        enabled: false
        skip_verify: false
        profile: strong
        trust: native
        ca_paths: []
        client_cert_path: null
        client_key_path: null
        pin_sha256: []
        server_name: null
        key_share: profile
      auto_offset_reset: latest
      session_timeout_ms: 30000
      commit_interval_ms: 5000
      statistics_interval_ms: 5000
      librdkafka_options: {}
      acknowledgements:
        enabled: true
  sink:
    $ref: "#/$defs/SinkConfig"
    default:
      transport: bus
      endpoint: http://dfe-loader:6000
      brokers:
      - localhost:9092
      topic: ""
      key_field: ""
      compression: zstd
      max_buffer_bytes: 67108864
      sasl:
        enabled: false
        mechanism: scram_sha_512
        username: ""
      tls:
        enabled: false
        skip_verify: false
        profile: strong
        trust: native
        ca_paths: []
        client_cert_path: null
        client_key_path: null
        pin_sha256: []
        server_name: null
        key_share: profile
      message_timeout_ms: 300000
      librdkafka_options: {}
  transforms:
    $ref: "#/$defs/TransformConfig"
    default:
      dir: null
      files: null
  enrichment_tables:
    type: array
    items:
      $ref: "#/$defs/EnrichmentTableConfig"
    default: []
  dlq:
    description: |-
      Where a record the sink refuses for good goes: one over the sink's
      size ceiling, or matched by an outbound `dlq` filter. scalo's type
      verbatim. The default writes NDJSON files under `/var/spool/scalo/dlq`,
      which the deployment contract declares writable. With `enabled: false`
      such a record is dropped and counted on
      `pipeline_dead_letters_dropped_total`.
    $ref: "#/$defs/DlqConfig"
    default:
      enabled: true
      mode: cascade
      queue_capacity: 10000
      batch_size: 256
      flush_interval_ms: 100
      max_payload_bytes: 524288
      file:
        enabled: true
        path: /var/spool/scalo/dlq
        rotation: hourly
        max_age_days: 30
        compress_rotated:
          codec: gzip
        max_bytes: null
        max_files: null
        durable: false
        file_mode: null
        dir_mode: null
$defs:
  PipelineConfig:
    description: Pipeline identity and processing settings.
    type: object
    properties:
      name:
        description: Pipeline name (used in metrics labels, Kafka `group_id`, logging).
        type: string
        default: default
      batch_size:
        description: Events per transform batch.
        type: integer
        format: uint
        minimum: 0
        default: 1000
      batch_timeout_ms:
        description: Max wait (ms) for a full batch before processing a partial batch.
        type: integer
        format: uint64
        minimum: 0
        default: 100
  SourceConfig:
    description: |-
      Source configuration: the bus topics to consume, or the Push listener to
      accept records on.
    type: object
    properties:
      transport:
        description: "`bus` consumes `topics`; `direct` accepts pushes on `listen`."
        $ref: "#/$defs/Transport"
        default: bus
      listen:
        description: Address the Push listener binds on the direct transport.
        type: string
        default: 0.0.0.0:6000
      brokers:
        type: array
        items:
          type: string
        default:
        - localhost:9092
      topics:
        type: array
        items:
          type: string
        default:
        - events
      group_id:
        type: string
        default: dfe-transform-vrl
      max_buffer_bytes:
        description: |-
          Bytes of fetched records librdkafka holds ahead of the pipeline, set
          as `queued.max.messages.kbytes`. One fetch can overshoot it by up to
          `max.partition.fetch.bytes`.
        type: integer
        format: uint64
        minimum: 0
        default: 67108864
      sasl:
        $ref: "#/$defs/SaslConfig"
        default:
          enabled: false
          mechanism: scram_sha_512
          username: ""
      tls:
        $ref: "#/$defs/TlsConfig"
        default:
          enabled: false
          skip_verify: false
          profile: strong
          trust: native
          ca_paths: []
          client_cert_path: null
          client_key_path: null
          pin_sha256: []
          server_name: null
          key_share: profile
      auto_offset_reset:
        type: string
        default: latest
      session_timeout_ms:
        type: integer
        format: uint32
        minimum: 0
        default: 30000
      commit_interval_ms:
        type: integer
        format: uint32
        minimum: 0
        default: 5000
      statistics_interval_ms:
        description: |-
          librdkafka statistics emission interval (ms). 0 = disabled.
          The statistics carry the broker RTT, consumer lag and queue depth
          metrics on `/metrics`, and the lag `/scaling/pressure` reports, so 0
          leaves the KEDA lag signal at zero.
        type: integer
        format: uint32
        minimum: 0
        default: 5000
      librdkafka_options:
        description: Extra librdkafka options.
        type: object
        additionalProperties:
          type: string
        default: {}
      acknowledgements:
        description: |-
          On (the default), the source is acknowledged -- a Kafka offset commit, a
          Push answered OK -- only once the transformed records are delivered to
          the sink, so a crash or a failed send re-delivers rather than loses them.
          Off, it is acknowledged at receipt.
        $ref: "#/$defs/AcknowledgementsConfig"
        default:
          enabled: true
  Transport:
    description: |-
      Which transport a stage uses.

      One deployment runs one of them: `bus` is a broker between the stages, `direct` is gRPC between them and needs no broker at all. The record and the transform are identical either way -- only who hands the record over changes. `kafka` and `grpc` are read as the same two, the names dfe-engine renders, and a config always writes `bus` and `direct` back.
    oneOf:
    - description: Kafka topics.
      type: string
      enum:
      - bus
      - kafka
    - description: A scalo Push listener (source) or client (sink).
      type: string
      enum:
      - direct
      - grpc
  SaslConfig:
    description: |-
      SASL authentication for Kafka.

      `password` is a [`SensitiveString`] so every serialise path redacts it by
      type rather than by a reader's field-name heuristic, and the emitted config
      schema carries `x-scalo-secret` + `writeOnly` on the field by construction.
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      mechanism:
        description: |-
          SASL mechanism: plain, `scram_sha_256`, `scram_sha_512`, or librdkafka's
          `PLAIN`, `SCRAM-SHA-256`, `SCRAM-SHA-512`, in any case.
        type: string
        default: scram_sha_512
      username:
        type: string
        default: ""
      password:
        type: string
        x-scalo-secret: true
        writeOnly: true
  TlsConfig:
    description: |-
      TLS configuration for Kafka: `enabled` and `skip_verify` beside scalo's
      client `tls` section (`profile`, `trust`, `ca_paths`, `client_cert_path`,
      `client_key_path`).
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      skip_verify:
        type: boolean
        default: false
      profile:
        description: |-
          `strong` (default), `commercial` or `cnsa2`. Per-profile settings, such
          as `allow_tls12`, live in the `tls.profiles` cascade section.
        $ref: "#/$defs/CryptoProfile"
        default: strong
      trust:
        description: "`native` (default), `platform` or `bundle`, as in [`TrustChoice`]."
        $ref: "#/$defs/TrustChoice"
        default: native
      ca_paths:
        description: |-
          CA PEM files, trusted beside the OS store under `native` and
          `platform`, and alone under `bundle`. One path or a list.
        anyOf:
        - type: string
        - type: array
          items:
            type: string
        default: []
      client_cert_path:
        description: Client certificate PEM for mutual TLS, with `client_key_path`.
        type:
        - string
        - "null"
        default: null
      client_key_path:
        description: |-
          Client private key PEM for mutual TLS, with `client_cert_path`. May
          name the same file when it holds both.
        type:
        - string
        - "null"
        default: null
      pin_sha256:
        description: |-
          SHA-256 pins on the server's public key, as in [`SpkiPin`]. Once the
          chain verifies, the key must match one. Empty checks no key.
        type: array
        items:
          $ref: "#/$defs/SpkiPin"
        default: []
      server_name:
        description: |-
          The name checked against the server's certificate and sent as SNI.
          Default the endpoint's host.
        type:
        - string
        - "null"
        default: null
      key_share:
        description: |-
          `profile` (default) sends the profile's first group, a post-quantum
          one. `classical` sends a classical share first.
        $ref: "#/$defs/KeyShare"
        default: profile
  CryptoProfile:
    description: A named TLS profile. `strong` is the default.
    oneOf:
    - description: |-
        TLS 1.3 only unless the profile sets `allow_tls12`, AES-256-GCM,
        ChaCha20 and AES-128-GCM, hybrid post-quantum key exchange first.
      type: string
      const: strong
    - description: |-
        TLS 1.3 and 1.2, every ECDHE AEAD suite, hybrid post-quantum key
        exchange first: the cheapest profile that is still current.
      type: string
      const: commercial
    - description: |-
        TLS 1.3 only, AES-256-GCM, ML-KEM-1024 then P-384, ECDSA P-384 and
        ML-DSA-87 signatures. The CNSA 2.0 shape.
      type: string
      const: cnsa2
  TrustChoice:
    description: |-
      Which certificates a client accepts a server's certificate from.

      Every choice trusts the CA files given beside it, and `bundle` trusts
      nothing else.
    oneOf:
    - description: |-
        The OS root store, read through `rustls-native-certs` and checked by
        rustls.
      type: string
      const: native
    - description: |-
        The OS verifier, through `rustls-platform-verifier`, so Windows and
        macOS apply their own policy and revocation checks.
      type: string
      const: platform
    - description: "Only the CA files given: an exclusive pin, with no OS root trusted."
      type: string
      const: bundle
  SpkiPin:
    description: >-
      SHA-256 of a server certificate's SubjectPublicKeyInfo, in base64 or 64 hex
      digits.
    type: string
    pattern: ^([0-9A-Fa-f]{64}|[A-Za-z0-9+/]{43}=)$
  KeyShare:
    description: Which key share a client sends first.
    oneOf:
    - description: "The profile's order: a post-quantum group first where it has one."
      type: string
      const: profile
    - description: |-
        A classical group first, with the post-quantum groups listed but not
        shared, for a receiver behind a middlebox that drops the larger
        ClientHello. A server that prefers a post-quantum group asks for it in
        a second round trip.
      type: string
      const: classical
  AcknowledgementsConfig:
    description: |-
      The `acknowledgements` section of an ack-capable transport.

      With `enabled: true` (the default) a source releases its acknowledgement --
      a Kafka offset commit, a gRPC or HTTP response -- only once every piece of
      work built from the record has been delivered, dead-lettered with the DLQ's
      confirmation, or dropped by policy. A failed delivery withholds it, so the
      record is delivered again: duplicates are possible, loss is not.

      With `enabled: false` the source acknowledges at receipt, before the record
      is processed: a crash or a failed delivery loses what was acknowledged.

      ```yaml
      kafka:
        acknowledgements:
          enabled: true
      ```
    type: object
    properties:
      enabled:
        description: Hold the source acknowledgement until every piece is delivered.
        type: boolean
        default: true
  SinkConfig:
    description: |-
      Sink configuration: the bus topic to produce to, or the Push listener to
      send the transformed records on to.
    type: object
    properties:
      transport:
        description: "`bus` produces to `topic`; `direct` pushes to `endpoint`."
        $ref: "#/$defs/Transport"
        default: bus
      endpoint:
        description: Downstream Push listener on the direct transport, e.g. the loader.
        type: string
        default: http://dfe-loader:6000
      brokers:
        type: array
        items:
          type: string
        default:
        - localhost:9092
      topic:
        type: string
        default: ""
      key_field:
        description: Event field path for Kafka partition key (e.g., ".`org_id`").
        type: string
        default: ""
      compression:
        description: "Compression: none, gzip, lz4, snappy, zstd."
        type: string
        default: zstd
      max_buffer_bytes:
        description: Maximum producer buffer size in bytes.
        type: integer
        format: uint64
        minimum: 0
        default: 67108864
      sasl:
        $ref: "#/$defs/SaslConfig"
        default:
          enabled: false
          mechanism: scram_sha_512
          username: ""
      tls:
        $ref: "#/$defs/TlsConfig"
        default:
          enabled: false
          skip_verify: false
          profile: strong
          trust: native
          ca_paths: []
          client_cert_path: null
          client_key_path: null
          pin_sha256: []
          server_name: null
          key_share: profile
      message_timeout_ms:
        description: |-
          Producer delivery timeout (ms). Capped at 15 s while a direct source
          holds its acknowledgements, so a report arrives inside the hold;
          `librdkafka_options.message.timeout.ms` overrides the cap.
        type: integer
        format: uint32
        minimum: 0
        default: 300000
      librdkafka_options:
        description: Extra librdkafka options.
        type: object
        additionalProperties:
          type: string
        default: {}
  TransformConfig:
    description: VRL transform file configuration.
    type: object
    properties:
      dir:
        description: Directory to load all .vrl transform files from (sorted by filename).
        type:
        - string
        - "null"
        default: null
      files:
        description: Explicit list of .vrl file paths (loaded in order).
        type:
        - array
        - "null"
        items:
          type: string
        default: null
  EnrichmentTableConfig:
    description: |-
      Enrichment table configuration.

      Supports two config formats:
      - **New (tagged):** `source` field with type-tagged enum (`file`, `mmdb`, `stix`, `sqlite`)
      - **Legacy (flat):** `path` + `key_columns` only (treated as `File` with auto format detection)
    type: object
    properties:
      name:
        description: "Table name used in VRL: `get_enrichment_table_record(\"name\", ...)`."
        type: string
        default: ""
      path:
        description: Path to enrichment data file (legacy flat format — kept for backwards compat).
        type: string
        default: ""
      key_columns:
        description: Lookup key column(s). Multiple columns are concatenated with `\x00`.
        type: array
        items:
          type: string
        default: []
      source:
        description: Source definition (new tagged format). Takes precedence over `path`.
        anyOf:
        - $ref: "#/$defs/EnrichmentSourceConfig"
        - type: "null"
        default: null
      schema:
        description: |-
          Per-column type coercion, matching Vector's file enrichment table
          `schema`. Without an entry a CSV cell stays a string, so
          `status_code: integer` is what makes `{"status_code": 1}` match, and a
          `timestamp` column is what makes a `{"from": ..., "to": ...}` date
          range able to match at all. Accepted values: `asis`, `bytes`,
          `string`, `int`, `integer`, `float`, `bool`, `boolean`, `date`,
          `date|<format>`, `timestamp`, `timestamp|<format>`. `asis` and
          `bytes` leave the cell alone.
        type: object
        additionalProperties:
          type: string
        default: {}
      refresh:
        description: Optional periodic refresh.
        anyOf:
        - $ref: "#/$defs/RefreshConfig"
        - type: "null"
        default: null
      max_bytes:
        description: |-
          Maximum materialised table size in bytes. A load over it fails startup,
          and a refresh over it is refused and the table keeps the rows it has.
        type:
        - integer
        - "null"
        format: uint64
        minimum: 0
        default: null
  EnrichmentSourceConfig:
    description: |-
      Source definition for an enrichment table. A key the source type does not
      have fails the load.
    oneOf:
    - type: object
      properties:
        type:
          type: string
          const: file
        path:
          type: string
        format:
          anyOf:
          - $ref: "#/$defs/FileFormat"
          - type: "null"
          default: null
      additionalProperties: false
      required:
      - type
      - path
    - type: object
      properties:
        type:
          type: string
          const: mmdb
        path:
          type: string
      additionalProperties: false
      required:
      - type
      - path
    - description: A STIX 2.1 bundle on disk.
      type: object
      properties:
        type:
          type: string
          const: stix
        path:
          type: string
      additionalProperties: false
      required:
      - type
      - path
    - type: object
      properties:
        type:
          type: string
          const: sqlite
        path:
          type: string
        query:
          type: string
      additionalProperties: false
      required:
      - type
      - path
      - query
  FileFormat:
    description: File format for enrichment table loading.
    type: string
    enum:
    - csv
    - json
    - yaml
    - auto
  RefreshConfig:
    description: Periodic refresh configuration.
    type: object
    properties:
      interval_secs:
        description: "Refresh interval in seconds. Minimum enforced: 60."
        type: integer
        format: uint64
        minimum: 0
    required:
    - interval_secs
  DlqConfig:
    description: Top-level DLQ configuration.
    type: object
    properties:
      enabled:
        description: Whether DLQ is enabled.
        type: boolean
        default: true
      mode:
        description: Backend routing mode.
        $ref: "#/$defs/DlqMode"
        default: cascade
      queue_capacity:
        description: |-
          Bounded mpsc capacity. When the queue is full, `try_send` returns
          `QueueFull` (overflow=Drop). Sized for failure-burst tolerance.
          Default 10_000.
        type: integer
        format: uint
        minimum: 0
        default: 10000
      batch_size:
        description: |-
          Drain coalesces up to this many entries into one backend write.
          Default 256.
        type: integer
        format: uint
        minimum: 0
        default: 256
      flush_interval_ms:
        description: |-
          Flush a partial batch after this duration, even if not full.
          Default 100 ms.
        type: integer
        format: uint64
        minimum: 0
        default: 100
      max_payload_bytes:
        description: |-
          Bytes an entry's payload and copied header values keep together: a
          longer payload is cut and the entry marked `truncated` with its
          original length, so it lands where the whole record could not, and a
          header value that does not fit is left out. `None` keeps every
          payload whole. Default [`DEFAULT_MAX_PAYLOAD_BYTES`].
        type:
        - integer
        - "null"
        format: uint
        minimum: 0
        default: 524288
      file:
        description: File backend configuration.
        $ref: "#/$defs/FileDlqConfig"
        default:
          enabled: true
          path: /var/spool/scalo/dlq
          rotation: hourly
          max_age_days: 30
          compress_rotated:
            codec: gzip
          max_bytes: null
          max_files: null
          durable: false
          file_mode: null
          dir_mode: null
  DlqMode:
    description: How backends are used when multiple are enabled.
    oneOf:
    - description: |-
        Try backends in order. Stop on first success.
        Default order: Kafka first, file fallback.
      type: string
      const: cascade
    - description: |-
        Write every batch to all enabled backends. The write succeeds when at
        least one backend takes the whole batch, and fails only when none does.
      type: string
      const: fan_out
    - description: File backend only (no Kafka dependency).
      type: string
      const: file_only
    - description: Kafka backend only (matches a typical consumer's current behaviour).
      type: string
      const: kafka_only
  FileDlqConfig:
    description: |-
      File-based DLQ configuration.

      Writes NDJSON files with automatic rotation and cleanup.
    type: object
    properties:
      enabled:
        description: Enable the file backend.
        type: boolean
        default: true
      path:
        description: |-
          Base directory for DLQ files.
          Service name is appended as a subdirectory. Default `/var/spool/scalo/dlq`.
        type: string
        default: /var/spool/scalo/dlq
      rotation:
        description: File rotation period.
        $ref: "#/$defs/RotationPeriod"
        default: hourly
      max_age_days:
        description: Auto-cleanup files older than this many days.
        type: integer
        format: uint32
        minimum: 0
        default: 30
      compress_rotated:
        description: |-
          Codec for rotated files past the six newest: `none`, `gzip` or `zstd`.
          Default gzip.
        type: object
        properties:
          codec:
            description: Codec for compress_rotated.
            type: string
            enum:
            - none
            - gzip
            - zstd
          level:
            description: "Level, by codec: gzip 1-9, zstd 1-22. Unset, the codec's default."
            type:
            - integer
            - "null"
            minimum: 1
            maximum: 22
        additionalProperties: false
        required:
        - codec
        default:
          codec: gzip
      max_bytes:
        description: |-
          Rotate before a write that would take the file past this many bytes.
          A write into an empty file always lands, however large. Unset: no size
          rotation. Works beside the time rotation: either rotates.
        type:
        - integer
        - "null"
        format: uint64
        minimum: 0
        default: null
      max_files:
        description: |-
          Rotated files kept, newest first. Older ones are deleted at each
          rotation. Unset: no count limit, only the age limit.
        type:
        - integer
        - "null"
        format: uint32
        minimum: 0
        default: null
      durable:
        description: |-
          Sync the file's data to disk after each write, and its directory after
          the file is created or rotated, so a write that returned `Ok` survives
          power loss. Costs a disk flush per batch. Off by default.
        type: boolean
        default: false
      file_mode:
        description: |-
          Mode for files the writer creates, before the umask. Unset: `0666`
          before the umask, except in the file transport, where it is `0600`.
          Unix only: a Windows file takes its folder's ACL. Existing files keep
          theirs.
        anyOf:
        - $ref: "#/$defs/FileMode"
        - type: "null"
        default: null
      dir_mode:
        description: |-
          Mode for directories the writer creates, before the umask. Unset:
          `0777` before the umask, except in the file transport, where it is
          `0700`. Unix only.
        anyOf:
        - $ref: "#/$defs/FileMode"
        - type: "null"
        default: null
  RotationPeriod:
    description: File rotation period, by local time.
    oneOf:
    - description: Rotate before the first write in a new hour.
      type: string
      const: hourly
    - description: Rotate before the first write on a new day.
      type: string
      const: daily
    - description: No time rotation. `max_bytes` can still rotate the file.
      type: string
      const: never
  FileMode:
    description: Unix permission mode in octal, such as "0600". Ignored on Windows.
    type: string
    pattern: ^(0o)?[0-7]{1,4}$
