# generate-artefacts writes no ArgoCD Application without a repo URL, and
# deploys into a namespace named after the app unless one is set here.
deployment:
  argocd:
    repo_url: https://github.com/hyperi-io/dfe-transform-vrl
    dest_namespace: dfe
