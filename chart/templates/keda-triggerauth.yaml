{{- /*
  HAND-EDITED -- do NOT overwrite this file with `emit-chart` output.

  The generator binds the username to `sasl`. KEDA's kafka scaler reads `sasl`
  as the mechanism enum and takes the principal in `username`, so a regenerated
  TriggerAuthentication supplies no username and the scaler answers "no username
  given" instead of a lag metric. Guarded by
  `test_committed_chart_matches_the_generator`, which also fails once the
  generator is fixed upstream -- drop this file from HAND_FIXED then.
*/}}
{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "dfe-transform-vrl.fullname" . }}-kafka-auth
  labels:
    {{- include "dfe-transform-vrl.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: username
      name: {{ include "dfe-transform-vrl.kafkaSecretName" . }}
      key: {{ .Values.kafka.secretKeys.username }}
    - parameter: password
      name: {{ include "dfe-transform-vrl.kafkaSecretName" . }}
      key: {{ .Values.kafka.secretKeys.password }}
{{- end }}
