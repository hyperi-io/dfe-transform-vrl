apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-transform-vrl.fullname" . }}
  labels:
    {{- include "dfe-transform-vrl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- if has (toString ((.Values.config).source).transport) (list "direct" "grpc") }}
    - port: 6000
      targetPort: 6000
      protocol: TCP
      name: push
    {{- end }}
  selector:
    {{- include "dfe-transform-vrl.selectorLabels" . | nindent 4 }}
