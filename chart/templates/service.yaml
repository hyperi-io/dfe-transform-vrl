apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-transform-vrl.fullname" . }}
  labels:
    {{- include "dfe-transform-vrl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- if eq (default "bus" ((.Values.config).source).transport) "direct" }}
    - port: {{ .Values.pushService.port | default 6000 }}
      targetPort: push
      protocol: TCP
      name: push
    {{- end }}
  selector:
    {{- include "dfe-transform-vrl.selectorLabels" . | nindent 4 }}
