# dfe-transform-vrl Helm chart values
#
# Based on dfe-transform-vector chart pattern.
# Customised from rustlib DeploymentContract output.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-transform-vrl
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

# -- PodMonitor for Prometheus Operator
podMonitor:
  enabled: false
  additionalLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Init containers (e.g. Artifactory transform fetch)
initContainers: []

# -- Extra volumes to add to the pod
extraVolumes: []

# -- Extra volume mounts to add to the main container
extraVolumeMounts: []

# -- Topology spread constraints
topologySpreadConstraints: []

# -- Application configuration (mounted as /etc/dfe/config.yaml)
config:
  health:
    address: 0.0.0.0:9000
  metrics:
    address: 0.0.0.0:9090
  pipeline:
    name: default
    batch_size: 1000
    batch_timeout_ms: 100
  source:
    brokers:
    - kafka:9092
    topics:
    - raw_events
    group_id: dfe-transform-vrl-default
    format: auto
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: false
  sink:
    brokers:
    - kafka:9092
    topic: enriched_events
    key_field: .org_id
    compression: zstd
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: false
  transforms:
    dir: /etc/dfe/transforms

# -- Kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "1000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config.source)
    topic: ""
    # -- Override consumer group (default: from config.source)
    consumerGroup: ""
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
