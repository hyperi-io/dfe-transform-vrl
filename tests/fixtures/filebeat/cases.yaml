      severity: 6
      timezone: UTC
      type:
      - info
      - denied
    log:
      level: informational
    network:
      transport: tcp
      type: ipv4
      packets: 3
    source:
      ip: 198.51.100.20
      port: 40012
      packets: 3
    destination:
      ip: 203.0.113.9
      port: 443
    message: list 120 denied tcp 198.51.100.20(40012) -> 203.0.113.9(443), 3 packets
    tags:
    - preserve_original_event

