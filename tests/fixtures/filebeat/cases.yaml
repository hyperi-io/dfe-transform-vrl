# Synthetic filebeat cases, replayed by the integration and e2e suites and the PGO workload.
# See README.md in this directory for the shape of a case.
- name: umbrella-dns-allowed
  module: umbrella
  line: |-
    "2026-03-04 09:15:22","alice.example","alice.example,Laptop 17","192.0.2.10","198.51.100.7","Allowed","1 (A)","NOERROR","www.example.net.","Business Services,Search Engines","Office Policy","AD Users, Roaming Computers",""
  expect:
    '@timestamp': '2026-03-04T09:15:22Z'
    observer:
      vendor: Cisco
      product: Umbrella
      type: dns
    log:
      file:
        path: /filebeat/cisco_umbrella/dnslogs
    event:
      action: dns-request-Allowed
      category: network
      kind: event
      type:
      - allowed
      - connection
    dns:
      type: query
      response_code: NOERROR
      question:
        name: www.example.net
        registered_domain: example.net
        subdomain: www
        top_level_domain: net
        type: 1 (A)
    source:
      ip: 192.0.2.10
      nat:
        ip: 198.51.100.7
    cisco:
      umbrella:
        identity: alice.example
    tags:
    - preserve_original_event

