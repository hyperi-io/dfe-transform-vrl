# =============================================================================
# dfe-transform-vrl — example configuration
# =============================================================================
#
# Copy to config.yaml and modify as needed.
#
# Configuration cascade (highest to lowest priority):
#   1. CLI args (--config, --log-level, etc.)
#   2. Environment variables (DFE_TRANSFORM_*)
#   3. .env file
#   4. Config file (this file)
#   5. Hard-coded defaults

# -----------------------------------------------------------------------------
# Pipeline identity and processing
# -----------------------------------------------------------------------------
pipeline:
  name: "my-pipeline"
  batch_size: 1000                     # events per transform batch
  batch_timeout_ms: 100                # max wait for full batch (ms)

# -----------------------------------------------------------------------------
# Kafka source (wrapper-controlled consumer)
# -----------------------------------------------------------------------------
# source:
#   brokers:
#     - "localhost:9092"
#   topics:
#     - "raw_events_land"
#   group_id: "dfe-transform-vrl-my-pipeline"
#   format: "auto"                     # auto, json, msgpack
#   max_buffer_bytes: 67108864         # 64 MiB consumer buffer
#   auto_offset_reset: "latest"        # latest, earliest
#   session_timeout_ms: 30000
#   commit_interval_ms: 5000
#   sasl:
#     enabled: true
#     mechanism: "scram_sha_512"       # plain, scram_sha_256, scram_sha_512
#     username: "${KAFKA_SASL_USERNAME}"
#     password: "${KAFKA_SASL_PASSWORD}"
#   tls:
#     enabled: true
#   # librdkafka overrides — production defaults baked in, override here
#   # librdkafka_options:
#   #   fetch.max.bytes: "10485760"

# -----------------------------------------------------------------------------
# Kafka sink (wrapper-controlled producer)
# -----------------------------------------------------------------------------
# sink:
#   brokers:
#     - "localhost:9092"
#   topic: "enriched_events_land"
#   key_field: ".org_id"               # Event field for Kafka partition key
#   compression: "zstd"                # none, gzip, lz4, snappy, zstd
#   max_buffer_bytes: 67108864         # 64 MiB producer buffer
#   message_timeout_ms: 300000         # producer delivery timeout
#   sasl:
#     enabled: true
#     mechanism: "scram_sha_512"
#     username: "${KAFKA_SASL_USERNAME}"
#     password: "${KAFKA_SASL_PASSWORD}"
#   tls:
#     enabled: true
#   # librdkafka overrides
#   # librdkafka_options:
#   #   linger.ms: "20"

# -----------------------------------------------------------------------------
# VRL transform files
# -----------------------------------------------------------------------------
# transforms:
#   dir: "/etc/dfe-transform-vrl/transforms/"        # directory of .vrl files (sorted by name)
#   # Or specify individual files (loaded in order):
#   # files:
#   #   - "/etc/dfe-transform-vrl/transforms/01_parse.vrl"
#   #   - "/etc/dfe-transform-vrl/transforms/02_enrich.vrl"
#   #   - "/etc/dfe-transform-vrl/transforms/03_filter.vrl"

# -----------------------------------------------------------------------------
# Health endpoint
# -----------------------------------------------------------------------------
# health:
#   address: "0.0.0.0:9000"

# -----------------------------------------------------------------------------
# Metrics endpoint
# -----------------------------------------------------------------------------
# metrics:
#   address: "0.0.0.0:9090"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "info"                        # trace, debug, info, warn, error
  format: "json"                       # json, text

# -----------------------------------------------------------------------------
# Horizontal scaling-pressure engine (rustlib 2.8.11 ScalingEngine)
# -----------------------------------------------------------------------------
# Read from the global config cascade by rustlib's ScalingEngineConfig (NOT the
# app's own serde loader). Requires the `expression` rustlib feature (enabled in
# Cargo.toml) -- without it the engine compiles out and this section is inert.
#
# Kafka-in -> transform -> Kafka-out: inbound + outbound are both kafka. The
# smart default emits `dfe_transform_vrl_scaling_pressure{name="default"}` =
# max(cpu_utilisation_ratio / cpu_target, transport_inbound_pressure_ratio),
# gated to 0 when the outbound circuit is open. The pipeline pushes per-pod
# assigned Kafka lag + the outbound circuit state every 5s.
scaling:
  enabled: true
  interval_secs: 15
  transport:
    inbound: kafka
    outbound: kafka
  params:
    cpu_target: 0.70
    # lag_target: PER-POD = sustained_msgs_per_sec_per_pod * tolerable_backlog_s.
    # TUNE-ME: left UNSET -- no measured per-pod VRL throughput exists yet, and
    # guessing mis-scales. With it unset the lag term contributes 0 and the
    # composite reduces to CPU vs the gratis inbound-pressure ratio. The KEDA
    # ScaledObject's per-partition kafka lagThreshold (1000) still scales on raw
    # lag independently. Set this once a real throughput number is measured.
  pressures: []                          # empty => the smart default
  # Legacy weighted ScalingPressure gate (worker-pool feedback). Retained.
  pressure_threshold: 0.8
