# =============================================================================
# dfe-transform-vrl — example configuration
# =============================================================================
#
# Copy to config.yaml and modify as needed.
#
# Configuration cascade (highest to lowest priority):
#   1. CLI args (--config, --log-level, etc.)
#   2. Environment variables (DFE_TRANSFORM_*)
#   3. .env file in the working directory (never a parent's)
#   4. Config file (this file)
#   5. Hard-coded defaults

# -----------------------------------------------------------------------------
# Pipeline identity and processing
# -----------------------------------------------------------------------------
pipeline:
  name: "my-pipeline"
  # NOT APPLIED. Parsed and validated, then read by nothing -- the batch engine
  # takes its chunk size from batch_processing.max_chunk_size (see the bottom of
  # this file), and the governed driver has no partial-batch timer. Setting
  # either logs a warning at startup.
  batch_size: 1000
  batch_timeout_ms: 100

# -----------------------------------------------------------------------------
# Source: the bus (Kafka topics) or direct (a Push listener)
# -----------------------------------------------------------------------------
# One deployment runs one transport. On `direct` there is no broker: the
# receiver or the fetcher pushes records straight to `listen`, and the
# brokers/topics/group_id below are unused.
# source:
#   transport: "bus"                   # bus | direct
#   listen: "0.0.0.0:6000"             # direct only: the Push listener address
#   brokers:
#     - "localhost:9092"
#   topics:
#     - "raw_events_land"
#   group_id: "dfe-transform-vrl-my-pipeline"
#   max_buffer_bytes: 67108864         # 64 MiB consumer buffer
#   auto_offset_reset: "latest"        # latest, earliest
#   session_timeout_ms: 30000
#   # NOT APPLIED: librdkafka auto-commit is off in the production profile --
#   # the engine commits at the at-least-once barrier after each sink ack.
#   commit_interval_ms: 5000
#   sasl:
#     enabled: true
#     mechanism: "scram_sha_512"       # plain, scram_sha_256, scram_sha_512
#     # This file is NOT interpolated -- a ${VAR} here reaches the broker as a
#     # literal. Supply credentials by environment instead:
#     #   DFE_TRANSFORM_KAFKA_SASL_USERNAME   (feeds source and sink)
#     #   DFE_TRANSFORM_KAFKA_SASL_PASSWORD
#     # Only when source and sink are different clusters:
#     #   DFE_TRANSFORM_SOURCE_SASL_USERNAME
#     #   DFE_TRANSFORM_SOURCE_SASL_PASSWORD
#     # An enabled block whose username or password is still empty by the time
#     # the env layer has run refuses to start, rather than authenticating
#     # against nothing and reporting Ready.
#     username: ""
#     password: ""
#   tls:
#     enabled: true
#     # DFE_TRANSFORM_KAFKA_SECURITY_PROTOCOL containing SSL (SASL_SSL, SSL)
#     # turns this on for source and sink. No value turns it off.
#     # A private broker CA, as a path in the pod. The chart mounts no file, so
#     # in Kubernetes put the PEM text in librdkafka_options ssl.ca.pem instead.
#     # ca_cert_file: "/etc/ssl/certs/kafka-ca.pem"
#   # librdkafka overrides -- production defaults baked in, override here
#   # librdkafka_options:
#   #   fetch.max.bytes: "10485760"
#   #   ssl.ca.pem: |
#   #     -----BEGIN CERTIFICATE-----
#   #     ...
#   #     -----END CERTIFICATE-----
#   # On: the offsets are committed, or the Push answered OK, only once the
#   # transformed records are delivered to the sink. Off: at receipt, and a
#   # crash or a failed send loses what was acknowledged.
#   acknowledgements:
#     enabled: true

# -----------------------------------------------------------------------------
# Sink: the bus (a Kafka topic) or direct (the next stage's Push listener)
# -----------------------------------------------------------------------------
# sink:
#   transport: "bus"                   # bus | direct
#   endpoint: "http://dfe-loader:6000" # direct only: where the records go next
#   brokers:
#     - "localhost:9092"
#   topic: "enriched_events_land"
#   # NOT APPLIED: the producer's key argument carries the destination topic,
#   # not a partition key, so nothing is derived from the event (scalo-rs#37).
#   key_field: ".org_id"
#   compression: "zstd"                # none, gzip, lz4, snappy, zstd
#   max_buffer_bytes: 67108864         # 64 MiB producer buffer
#   # Producer delivery timeout. Capped at 15000 while a direct source holds
#   # its acknowledgements, so the report lands inside the 18 s hold; set
#   # librdkafka_options message.timeout.ms to override the cap.
#   message_timeout_ms: 300000
#   sasl:
#     enabled: true
#     mechanism: "scram_sha_512"
#     # Not interpolated -- see the source block above. The shared
#     # DFE_TRANSFORM_KAFKA_SASL_* pair covers this too; override it only for a
#     # separate sink cluster:
#     #   DFE_TRANSFORM_SINK_SASL_USERNAME
#     #   DFE_TRANSFORM_SINK_SASL_PASSWORD
#     username: ""
#     password: ""
#   tls:
#     enabled: true
#   # librdkafka overrides
#   # librdkafka_options:
#   #   linger.ms: "20"

# -----------------------------------------------------------------------------
# VRL transform files
# -----------------------------------------------------------------------------
# transforms:
#   dir: "/etc/dfe-transform-vrl/transforms/"        # directory of .vrl files (sorted by name)
#   # Or specify individual files (loaded in order):
#   # files:
#   #   - "/etc/dfe-transform-vrl/transforms/01_parse.vrl"
#   #   - "/etc/dfe-transform-vrl/transforms/02_enrich.vrl"
#   #   - "/etc/dfe-transform-vrl/transforms/03_filter.vrl"

# --- OPTIONAL: bundled DFE 2.1 filebeat-compat pipeline (INTERIM) ------------
# Pre-canned pure-VRL port of the DFE 2.1 filebeat templates (Cisco Meraki /
# IOS / Umbrella). Being replaced by dfe-transform-elastic (beta) - see
# pipelines/filebeat/README.md before adopting. The stock image ships no
# pipelines/ directory - copy or mount the two files from the repo's
# pipelines/filebeat/ first, then point the generic knobs at them:
# transforms:
#   dir: "/etc/dfe-transform-vrl/pipelines/filebeat/"
# enrichment_tables:
#   - name: "timezones"
#     path: "/etc/dfe-transform-vrl/pipelines/filebeat/timezones.csv"
#     key_columns: ["abbreviation"]

# -----------------------------------------------------------------------------
# Enrichment tables
# -----------------------------------------------------------------------------
# Reached from VRL as get_enrichment_table_record("name", condition, ...) and
# find_enrichment_table_records("name", condition, ...), following Vector's
# contract: every condition field must match, a get with no match or more than
# one match errors, and the table name must be a literal naming a table listed
# here or the program fails to compile.
#
# key_columns index the lookup; a condition on any other column still filters,
# it just does not use the index.
#
# schema coerces text columns, which is what makes a numeric comparison or a
# date range able to match. Accepted: asis, bytes, string, int, integer,
# float, bool, boolean, date, date|<format>, timestamp, timestamp|<format>.
# asis, bytes and string all leave the cell as text.
#
# A condition naming a column the table does not have is a compile error, so
# a typo fails at startup rather than never matching.
# enrichment_tables:
#   - name: "services"
#     path: "/etc/dfe-transform-vrl/enrichment/services.csv"
#     key_columns: ["service_id"]
#     schema:
#       status_code: "integer"
#       commissioned: "date"
#     refresh:
#       interval_secs: 300
#   # MaxMind GeoIP2/GeoLite2, requires the enrichment-mmdb build feature.
#   # The condition takes exactly one field, whose value is the IP address.
#   - name: "geoip"
#     source:
#       type: "mmdb"
#       path: "/etc/dfe-transform-vrl/enrichment/GeoLite2-City.mmdb"

# -----------------------------------------------------------------------------
# scalo's own settings -- NOT in this file, /livez and /readyz included
# -----------------------------------------------------------------------------
# metrics, logger, scaling, worker_pool, batch_processing, self_regulation and
# version_check belong to scalo's config cascade. That cascade discovers files
# by fixed base name (defaults.yaml, settings.yaml, settings.{env}.yaml) and so
# never reads a file called config.yaml -- writing those sections here parses
# cleanly and changes nothing, and the wrapper warns at startup if it finds one.
#
# Set them through the env layer instead. The section nests on a DOUBLE
# underscore; a single one produces a flat key that matches nothing:
#
#   METRICS_ADDR=0.0.0.0:9090            # or DFE_TRANSFORM_METRICS__ADDRESS
#   LOG_LEVEL=debug                      # or DFE_TRANSFORM_LOGGER__LEVEL
#   LOG_FORMAT=json                      # or DFE_TRANSFORM_LOGGER__FORMAT
#   DFE_TRANSFORM_SCALING__ENABLED=true
#   DFE_TRANSFORM_SCALING__MEMORY_GATE_THRESHOLD=0.8
#   DFE_TRANSFORM_BATCH_PROCESSING__MAX_CHUNK_SIZE=10000
#
# batch_processing.max_chunk_size is the events-per-chunk dial the batch engine
# actually reads. pipeline.batch_size above is NOT it -- see the "accepted but
# not applied" list in the README.
