# Project language (auto-detected if not specified)
language: rust

# Quality checks
quality:
  enabled: true
  # Advisory ignores fed to cargo-audit and osv-scanner.
  ignore:
    # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 reaches the
    # lock only through scalo. The flaw is in BaggagePropagator's header parsing,
    # and neither this repo nor scalo installs a text map propagator, so it is
    # never called. scalo holds 0.31 until metrics-exporter-opentelemetry
    # supports 0.32 (dfe-infra docs/THREAT-MODEL.md).
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: BaggagePropagator::extract_with_context is unreachable (no text map propagator, no baggage in dfe-transform-vrl or scalo). Drop when scalo allows opentelemetry_sdk >= 0.32.1."
  rust:
    features: default

# Testing
test:
  enabled: true
  coverage: true
  rust:
    # Added to the default set, so the MMDB and SQLite enrichment tests are compiled in.
    features: enrichment-mmdb,enrichment-sqlite
    # Require process-per-test isolation rather than taking whatever the
    # runner has installed.
    nextest: true

# Building
build:
  enabled: true
  # PGO and BOLT are off for the rc.14 workstream: each adds 30-60 min per arch
  # and the workstream needs fast turnaround on everything else first. Tier 1
  # (allocator + LTO) still applies. Turning this back off is the LAST rc.14
  # task. A STABLE release meanwhile needs `release-unoptimized: true` at
  # dispatch; a prerelease (rc) is never refused.
  skip_optimize: true
  type: app
  strategies:
    - native
  rust:
    # The shipped binary needs these too, not just the test stage - the
    # Dockerfile only COPYs the built binary, so a default build leaves the
    # container rejecting `type: mmdb` and `type: sqlite` tables at startup.
    features: enrichment-mmdb,enrichment-sqlite
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Release (where the artefacts go)
release:
  enabled: true
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
