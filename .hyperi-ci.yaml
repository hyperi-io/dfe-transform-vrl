# Project language (auto-detected if not specified)
language: rust

# Quality checks
quality:
  enabled: true
  rust:
    features: default

# Testing
test:
  enabled: true
  coverage: true

# Building
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # Tier 2 release-track optimisation. hyperi-ci enables jemalloc + fat
    # LTO automatically; this section opts in to PGO + BOLT on top. PGO
    # adds ~20-25 min per arch to release builds (Tier 1 baseline ~4 min,
    # Tier 2 ~26 min) — only runs on the release channel.
    optimize:
      pgo:
        enabled: true
        workload_cmd: "bash scripts/pgo-workload.sh"
        # Floor of 60s in the workload script; 300s default produces stable
        # profiles. Loader canary observed shorter runs giving NEGATIVE PGO.
        duration_secs: 300
      bolt:
        enabled: true  # Linux only; skipped on non-Linux targets

# Publishing (on release)
publish:
  enabled: true
  # target=both maps to the release channel which unlocks Tier 2 PGO+BOLT
  # (target=internal resolves to spike channel — Tier 1 only).
  target: both
  binaries: both
  container:
    enabled: true
    registry: jfrog
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
    registry: jfrog
