# Project language (auto-detected if not specified)
language: rust

# Quality checks
quality:
  enabled: true
  rust:
    features: default

# Testing
test:
  enabled: true
  coverage: true
  rust:
    # Added to the default set, so the MMDB enrichment tests are compiled in.
    features: enrichment-mmdb
    # Require process-per-test isolation rather than taking whatever the
    # runner has installed.
    nextest: true

# Building
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    # The shipped binary needs this too, not just the test stage - the
    # Dockerfile only COPYs the built binary, so a default build leaves the
    # container rejecting `type: mmdb` tables at startup.
    features: enrichment-mmdb
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Release (where the artefacts go)
release:
  enabled: true
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
