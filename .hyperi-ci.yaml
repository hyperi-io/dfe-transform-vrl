# Project language (auto-detected if not specified)
language: rust

# Quality checks
quality:
  enabled: true
  # Advisory ignores fed to cargo-audit and osv-scanner.
  ignore:
    # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 reaches the
    # lock only through scalo. The flaw is in BaggagePropagator's header parsing,
    # and neither this repo nor scalo registers a Baggage or any other text map
    # propagator, so it is never called. Accepted as unreachable in the DFE
    # threat model (dfe-infra docs/THREAT-MODEL.md, accepted risks). scalo stays
    # on the 0.31 line until metrics-exporter-opentelemetry, at 0.2.1 requiring
    # opentelemetry ^0.31, moves: hyperi-io/scalo-rs#281.
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: unreachable, no Baggage propagator registered in dfe-transform-vrl or scalo. Accepted risk per dfe-infra docs/THREAT-MODEL.md. Drop when hyperi-io/scalo-rs#281 moves scalo off opentelemetry 0.31, blocked on metrics-exporter-opentelemetry 0.2.1 requiring opentelemetry ^0.31."
  rust:
    features: default

# Testing
test:
  enabled: true
  coverage: true
  rust:
    # Added to the default set, so the MMDB and SQLite enrichment tests are compiled in.
    features: enrichment-mmdb,enrichment-sqlite
    # Require process-per-test isolation rather than taking whatever the
    # runner has installed.
    nextest: true

# Building
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    # The shipped binary needs these too, not just the test stage - the
    # Dockerfile only COPYs the built binary, so a default build leaves the
    # container rejecting `type: mmdb` and `type: sqlite` tables at startup.
    features: enrichment-mmdb,enrichment-sqlite
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Release (where the artefacts go)
release:
  enabled: true
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
