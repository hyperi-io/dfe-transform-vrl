# Project language (auto-detected if not specified)
language: rust

# Quality checks
quality:
  enabled: true
  rust:
    features: default

# Testing
test:
  enabled: true
  coverage: true
  rust:
    # Added to the default set, so the MMDB enrichment tests are compiled in.
    features: enrichment-mmdb
    # Require process-per-test isolation rather than taking whatever the
    # runner has installed.
    nextest: true

# Building
build:
  enabled: true
  # PGO and BOLT are off for the rc.14 workstream: each adds 30-60 min per arch
  # and the workstream needs fast turnaround on everything else first. Tier 1
  # (allocator + LTO) still applies. Turning this back off is the LAST rc.14
  # task. A STABLE release meanwhile needs `release-unoptimized: true` at
  # dispatch; a prerelease (rc) is never refused.
  skip_optimize: true
  type: app
  strategies:
    - native
  rust:
    # The shipped binary needs this too, not just the test stage - the
    # Dockerfile only COPYs the built binary, so a default build leaves the
    # container rejecting `type: mmdb` tables at startup.
    features: enrichment-mmdb
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # Tier 2 release-track optimisation. hyperi-ci enables jemalloc + fat
    # LTO automatically; this section opts in to PGO + BOLT on top. PGO
    # adds ~20-25 min per arch to release builds (Tier 1 baseline ~4 min,
    # Tier 2 ~26 min) — only runs on the release channel.
    optimize:
      pgo:
        enabled: true
        workload_cmd: "bash scripts/pgo-workload.sh"
        # Floor of 60s in the workload script; 300s default produces stable
        # profiles. Loader canary observed shorter runs giving NEGATIVE PGO.
        duration_secs: 300
      bolt:
        enabled: true  # Linux only; skipped on non-Linux targets

# Release (where the artefacts go)
release:
  enabled: true
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
