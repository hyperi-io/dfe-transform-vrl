classification: product

# Project language (auto-detected if not specified)
language: rust

# Quality checks
quality:
  enabled: true
  # Advisory ignores fed to cargo-audit and osv-scanner.
  ignore:
    # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 reaches the
    # lock only through scalo. The flaw is in BaggagePropagator's header parsing,
    # and neither this repo nor scalo registers a Baggage or any other text map
    # propagator, so it is never called. Accepted as unreachable in the DFE
    # threat model (dfe-infra docs/THREAT-MODEL.md, accepted risks). scalo stays
    # on the 0.31 line until metrics-exporter-opentelemetry, at 0.2.1 requiring
    # opentelemetry ^0.31, moves: hyperi-io/scalo-rs#281.
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: unreachable, no Baggage propagator registered in dfe-transform-vrl or scalo. Accepted risk per dfe-infra docs/THREAT-MODEL.md. Drop when hyperi-io/scalo-rs#281 moves scalo off opentelemetry 0.31, blocked on metrics-exporter-opentelemetry 0.2.1 requiring opentelemetry ^0.31."
    # unsafe-libyaml arrives through the vrl crate's serde_yaml_ng, a normal and a build dependency of it; revisit when vrl moves off serde_yaml_ng.
    - tool: osv-scanner
      id: RUSTSEC-2024-0449
      reason: "unsafe-libyaml is unmaintained, with no known CVE (RUSTSEC-2023-0075 was fixed in 0.2.10). Only operator-written VRL reaches it on event data: the stdlib's parse_yaml hands libyaml what the event carries, and ingested data cannot add that call. Config YAML parses through scalo's serde-saphyr. Drop when the vrl crate moves off serde_yaml_ng."
  rust:
    features: default

# Testing
test:
  enabled: true
  coverage: true
  rust:
    # Added to the default set, so the MMDB and SQLite enrichment tests are compiled in.
    features: enrichment-mmdb,enrichment-sqlite
    # Require process-per-test isolation rather than taking whatever the
    # runner has installed.
    nextest: true
  # A release runs the full tier, the ignored e2e tests included. tests/TESTING.md says which tests are which.
  full:
    required_for_release: true

# Building
build:
  enabled: true
  strategies:
    - native
  rust:
    glibc_max: "2.41"
    # librdkafka and OpenSSL link statically from hyperi-ci's prefix, so the
    # image installs no C library packages.
    static_libs: true
    optimize:
      pgo:
        # Built before the workload clock starts: an uncached arm64 runner takes longer than the workload timeout to compile it.
        workload_setup_cmd: "cargo build --release --features pgo-driver --bin pgo-driver"
    # The shipped binary needs these too, not just the test stage - the
    # Dockerfile only COPYs the built binary, so a default build leaves the
    # container rejecting `type: mmdb` and `type: sqlite` tables at startup.
    features: enrichment-mmdb,enrichment-sqlite
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Release (where the artefacts go). The thin chart is assembled from the
# emitted contract and ships beside the image.
release:
  enabled: true
  # Keep `library` at the scalo version in Cargo.toml: the library renders only the contract version its scalo release writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.20"
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
