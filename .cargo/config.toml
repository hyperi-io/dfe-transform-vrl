# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Target platforms: Linux x86_64 and aarch64 only

# =============================================================================
# Per-target CPU optimisations
# =============================================================================

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-cpu=generic"]

# For local development, use native CPU features
[build]
rustflags = ["-C", "target-cpu=native"]

# Limit parallel jobs to reduce CPU/memory usage

# =============================================================================
# HyperI Private Cargo Registry (Artifactory)
# =============================================================================

[registries.hyperi]
index = "sparse+https://hypersec.jfrog.io/artifactory/api/cargo/hyperi-cargo-virtual/index/"
credential-provider = "cargo:token"

# =============================================================================
# Network resilience for crate downloads
# =============================================================================
# CI crate fetches intermittently die with "[16] Error in the HTTP2 framing
# layer" (a curl/HTTP2 interaction against the crates.io CDN, not a code or
# dependency fault). Force HTTP/1.1 to sidestep the framing bug entirely, and
# raise the retry budget so any remaining transient blip self-heals instead of
# failing the build.
[http]
multiplexing = false

[net]
retry = 10
